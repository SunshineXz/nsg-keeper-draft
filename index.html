<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSG Draft Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="eyebrow" id="season">Draft</span>
    <h1 id="leagueName">Draft Room</h1>
  </div>
  <div class="clock-card" id="clockCard">
    <div class="clock-meta"><span id="pickLabel">&nbsp;</span><span id="statusBadge" class="badge"></span></div>
    <div class="clock-team" id="onClock">&nbsp;</div>
    <div class="clock-time" id="clockTime">--:--</div>
    <div class="clock-bar"><div id="clockBar"></div></div>
  </div>
  <div class="who">
    <div id="whoChip" class="chip">Viewing</div>
    <span id="connDot" class="dot" title="Connecting..."></span>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<nav class="commish" id="commishBar" hidden>
  <span class="commish-label">Commissioner</span>
  <button class="btn" id="cKeepers">Keepers</button>
  <button class="btn primary" id="cStart">Start draft</button>
  <button class="btn" id="cTest" title="Uses your default keepers for every team">Start test draft</button>
  <button class="btn" id="cPause">Pause</button>
  <button class="btn primary" id="cResume">Resume</button>
  <button class="btn" id="cAuto" title="Make the clock's auto-pick right now: best ESPN ADP that fits the team on the clock">Auto-pick now</button>
  <button class="btn" id="cUndo">&#8630; Undo last pick</button>
  <label class="clock-set">Clock <input type="number" id="cClock" min="10" max="600" step="5"> s <button class="btn" id="cClockSet">Set</button></label>
  <button class="btn" id="cLinks">Team links</button>
  <button class="btn" id="cExport">Export CSV</button>
  <button class="btn danger" id="cReset">Reset draft</button>
</nav>

<div class="upnext" id="upNext"></div>

<nav class="tabs" id="tabs">
  <button data-tab="players" class="active">Players</button>
  <button data-tab="board">Board</button>
  <button data-tab="teams" class="mobile-only">Teams</button>
  <button data-tab="log">Picks</button>
</nav>

<main class="layout">
  <section class="panel tab-panel" id="tab-players">
    <div class="filters">
      <input id="search" type="search" placeholder="Search players" autocomplete="off">
      <div class="seg" id="posFilter">
        <button data-pos="all" class="on">All</button>
        <button data-pos="F">F</button>
        <button data-pos="D">D</button>
        <button data-pos="G">G</button>
      </div>
      <label class="check" id="fitsWrap" hidden><input type="checkbox" id="fitsOnly"> Only players my team can fit</label>
    </div>
    <div class="table-wrap">
      <table class="players">
        <thead><tr>
          <th data-sort="n">Player</th>
          <th>Pos</th>
          <th data-sort="cap" class="num">Cap hit</th>
          <th data-sort="pts" class="num">Proj pts</th>
          <th data-sort="adp" class="num sorted">ADP</th>
          <th></th>
        </tr></thead>
        <tbody id="playerRows"></tbody>
      </table>
    </div>
    <p class="hint" id="rowHint"></p>
  </section>

  <section class="panel tab-panel" id="tab-board" hidden>
    <div class="table-wrap"><table class="board" id="boardTable"></table></div>
  </section>

  <section class="panel tab-panel" id="tab-log" hidden>
    <div id="logList"></div>
  </section>

  <aside class="panel teams tab-panel" id="tab-teams">
    <h2>Teams</h2>
    <div id="teamList"></div>
  </aside>
</main>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast" hidden></div>

<footer class="foot">
  <span id="builtInfo"></span>
  <button id="commishSignIn" class="linkbtn">Commissioner sign-in</button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
